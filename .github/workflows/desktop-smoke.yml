name: Desktop Smoke

# Manual only: run it before a desktop release from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: desktop/build/bin/Paisa
          - os: macos-14
            binary: desktop/build/bin/Paisa.app/Contents/MacOS/Paisa
          - os: windows-2022
            binary: desktop/build/bin/Paisa.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pre-install Bun from npm registry (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.bun/bin
          if [ "$RUNNER_OS" = "macOS" ]; then
            bun_pkg="bun-darwin-aarch64"
            if [ "$(uname -m)" = "x86_64" ]; then bun_pkg="bun-darwin-x64"; fi
          else
            bun_pkg="bun-linux-x64"
          fi
          curl -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/@oven/${bun_pkg}/-/${bun_pkg}-1.4.4.tgz" | tar -xz -C ~/.bun/bin --strip-components=2 package/bin/bun
      - name: Pre-install Bun from npm registry (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.bun\bin" | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/@oven/bun-windows-x64/-/bun-windows-x64-1.4.4.tgz" -o bun.tgz
          tar.exe -xzf bun.tgz -C "$HOME\.bun\bin" --strip-components=2 package/bin/bun.exe
          Remove-Item bun.tgz
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ledger sqlite3 libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config xvfb
      - if: runner.os == 'macOS'
        run: brew install ledger sqlite3
      - if: runner.os == 'Windows'
        run: choco install ledger sqlite
      - run: cd frontend && bun install --frozen-lockfile && bun run build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        working-directory: desktop
        run: wails build -tags webkit2_40
      - name: Build desktop app
        if: runner.os != 'Linux'
        working-directory: desktop
        run: wails build
      - name: Smoke-test Linux app
        if: runner.os == 'Linux'
        working-directory: frontend
        env:
          PAISA_DESKTOP_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: xvfb-run -a bun run test:desktop
      - name: Smoke-test desktop app
        if: runner.os != 'Linux'
        working-directory: frontend
        env:
          PAISA_DESKTOP_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: bun run test:desktop
