name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_CONFIG_NATIVE_IGNORE_WARNING: true

jobs:
  nix-warmup:
    name: Nix & Deno Warmup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          save-nix-cache: "true"

  lint:
    name: Lint & Type-Check
    needs: nix-warmup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: Lint and type-check
        run: nix develop --command make lint

  unit-coverage:
    name: Backend & Frontend Coverage
    needs: nix-warmup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: Backend and frontend coverage
        run: |
          nix develop --command bash -c "
            cd frontend && deno run -A npm:@sveltejs/kit sync
            cd ..
            make test-backend test-unit test-coverage
          "
      - name: Upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: coverage/

  integration:
    name: API Regression Tests
    needs: nix-warmup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: API regression tests
        run: |
          nix develop --command bash -c "
            cd backend && make build
            cd ../frontend && TZ=UTC deno task test:integration
          "

  browser:
    name: Browser E2E Tests
    needs: nix-warmup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: Browser E2E tests
        run: |
          nix develop --command bash -c "
            make build-frontend test-e2e
          "
      - name: Upload browser test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
