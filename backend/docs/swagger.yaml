        type: string
      saved:
        type: boolean
    type: object
  dto.SheetsResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/dto.SheetFileResponse'
        type: array
      postings:
        items:
          $ref: '#/definitions/dto.PostingResponse'
