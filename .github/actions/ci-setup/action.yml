name: CI Setup
description: Setup Go, Bun, Python, system tools, and dependencies

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.5"
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set environment variables
      shell: bash
      run: |
        echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

    - name: Restore CI tools cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/paisa-ci-bin
        key: ci-tools-${{ runner.os }}-hledger-1.52.4-golangci-lint-2.14.0

    - name: Install system dependencies & accounting tools
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          sqlite3 \
          libsqlite3-dev \
          ledger \
          beancount \
          pkg-config \
          build-essential

        pip install --break-system-packages "beancount<3"

        mkdir -p ~/.cache/paisa-ci-bin
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT

        download_release_asset() {
          local repo="$1" tag="$2" asset="$3" dest="$4"
          for attempt in 1 2 3; do
            if gh release download "$tag" --repo "$repo" --pattern "$asset" --output "$dest" --clobber 2>/dev/null || \
               curl -fsSL --retry 5 --retry-all-errors -o "$dest" "https://github.com/$repo/releases/download/$tag/$asset"; then
              return 0
            fi
            echo "Retrying download of $repo@$tag/$asset (attempt $attempt)..." >&2
            sleep $((attempt * 2))
          done
          return 1
        }

        # Install pinned hledger 1.52.4 static binary
        if [ ! -f ~/.cache/paisa-ci-bin/hledger ]; then
          download_release_asset "hledgerorg/hledger" "1.52.4" "hledger-linux-x64.tar.gz" "$tmpdir/hledger.tar.gz"
          tar -xzf "$tmpdir/hledger.tar.gz" -C ~/.cache/paisa-ci-bin hledger
        fi
        sudo install -m 0755 ~/.cache/paisa-ci-bin/hledger /usr/local/bin/hledger

        # Install golangci-lint
        if [ ! -f ~/.cache/paisa-ci-bin/golangci-lint ]; then
          download_release_asset "golangci/golangci-lint" "v2.14.0" "golangci-lint-2.14.0-linux-amd64.tar.gz" "$tmpdir/golangci-lint.tar.gz"
          tar -xzf "$tmpdir/golangci-lint.tar.gz" -C ~/.cache/paisa-ci-bin --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
        fi
        sudo install -m 0755 ~/.cache/paisa-ci-bin/golangci-lint /usr/local/bin/golangci-lint

        # Verify accounting tools are in PATH
        ledger --version
        hledger --version
        bean-check --help >/dev/null && echo "bean-check OK"
        bean-query --help >/dev/null && echo "bean-query OK"
        bean-report --help >/dev/null && echo "bean-report OK"

    - name: Restore Bun cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          frontend/node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install frontend dependencies
      shell: bash
      run: |
        cd frontend
        bun install --frozen-lockfile
