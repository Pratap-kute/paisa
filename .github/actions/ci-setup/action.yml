name: CI Setup
description: Install Nix, restore caches, and install Deno dependencies

inputs:
  save-nix-cache:
    description: Whether this job should save the Nix store
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@v30

    - name: Restore or save Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        # v2 replaces the old cache, which omitted development-shell packages.
        primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-v2-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 2G
        save: ${{ inputs.save-nix-cache }}

    - name: Restore Deno cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/deno
          frontend/node_modules
        key: deno-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Prepare persistent Nix environment and frontend dependencies
      id: go-cache
      shell: bash
      run: |
        # Keep the shell closure alive during the cache action's post-job GC.
        # Reuse this profile in test steps to avoid evaluating the flake again.
        ci_profile="$RUNNER_TEMP/paisa-ci-profile"
        nix develop --profile "$ci_profile" --command bash -euc '
          {
            echo "modules=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
          cd frontend
          deno install
        '
        echo "PAISA_CI_PROFILE=$ci_profile" >> "$GITHUB_ENV"

    - name: Restore or save Go caches
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-cache.outputs.modules }}
          ${{ steps.go-cache.outputs.build }}
        # Separate writers by job; refresh compiled packages as source changes.
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'backend/go.sum') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'backend/go.sum') }}-${{ github.job }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'backend/go.sum') }}-
