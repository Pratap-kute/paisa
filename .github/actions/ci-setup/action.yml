name: CI Setup
description: Setup Go, Deno, Python, system tools, and dependencies

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.5"
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set environment variables
      shell: bash
      run: |
        echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

    - name: Install system dependencies & accounting tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          sqlite3 \
          libsqlite3-dev \
          ledger \
          beancount \
          pkg-config \
          build-essential

        pip install --break-system-packages "beancount<3" mkdocs-material

        # Install pinned hledger 1.52.4 static binary
        if [ ! -f /usr/local/bin/hledger ]; then
          curl -sSL https://github.com/hledgerorg/hledger/releases/download/1.52.4/hledger-linux-x64.tar.gz | sudo tar -xz -C /usr/local/bin
        fi

        # Install golangci-lint
        if ! command -v golangci-lint &>/dev/null; then
          curl -sSL "https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz" | \
            sudo tar -xz -C /usr/local/bin --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
        fi

        # Verify accounting tools are in PATH
        ledger --version
        hledger --version
        bean-check --help >/dev/null && echo "bean-check OK"
        bean-query --help >/dev/null && echo "bean-query OK"
        bean-report --help >/dev/null && echo "bean-report OK"

    - name: Restore Deno cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/deno
          frontend/node_modules
        key: deno-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Install frontend dependencies
      shell: bash
      run: |
        cd frontend
        deno install
