name: Mac OS Release

on:
  push:
    branches:
      - ci/mac-*
    tags:
      - "*"

permissions:
  contents: write

jobs:
  mac-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: |
          brew install --force --overwrite sqlite3 create-dmg ledger
          cp "$(brew --prefix ledger)/bin/ledger" backend/pkg/binary/ledger
          cd frontend && deno install && deno task build && cd ..
          cd backend && go build -o ../paisa-cli-macos-amd64 . && cd ..
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build
          create-dmg --volname "Paisa" --window-pos 200 120 --window-size 800 400 --icon-size 100  --icon "Paisa.app" 200 190 --app-drop-link 600 185 --hide-extension "Paisa.app" --volicon build/bin/Paisa.app/Contents/Resources/iconfile.icns  "Paisa.dmg" build/bin/Paisa.app
          cd ..
          cp desktop/Paisa.dmg paisa-app-macos-amd64.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
