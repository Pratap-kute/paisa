      long_term:
        type: number
      short_term:
        type: number
      slab:
        type: number
      taxable:
        type: number
    type: object
  dto.TaxTimelineItemResponse:
    properties:
      end_date:
        type: string
      postings:
        items:
          $ref: '#/definitions/dto.PostingResponse'
        type: array
