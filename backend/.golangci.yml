version: "2"

run:
  issues-exit-code: 1
  allow-parallel-runners: true
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unparam
    - unused
  settings:
    goconst:
      ignore-tests: true
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: false
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-checks:
        - badLock
        - boolExprSimplify
        - emptyStringTest
        - filepathJoin
        - nilValReturn
        - rangeValCopy
        - sliceClear
        - stringsCompare
        - truncateCmp
    gocyclo:
      min-complexity: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: early-return
        - name: error-strings
        - name: if-return
        - name: unexported-return
        - name: var-naming

  exclusions:
    generated: lax
    rules:
      # Test fixtures intentionally duplicate setup and use controlled paths,
      # subprocesses, credentials, and permissions to exercise edge cases.
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - revive
          - unparam
      # These backup paths are derived through the validated safe-path helpers.
      - path: pkg/server/(editor|sheet)\.go
        text: G703
        linters:
          - gosec
      # This utility intentionally executes the caller-supplied command.
      - path: pkg/utils/unix\.go
        text: G204
        linters:
          - gosec
      # Repeated JSON response keys are clearer inline than as constants.
      - path: pkg/server/
        linters:
          - goconst
      - path: pkg/utils/
        text: "var-naming: avoid meaningless package names"
        linters:
          - revive
    paths:
      - vendor
      - web/static
      - desktop/build
      - dist
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - web/static
      - desktop/build
      - dist
      - node_modules
