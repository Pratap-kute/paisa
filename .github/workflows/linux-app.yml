name: Linux App Release

on:
  push:
    branches:
      - ci/linux-app-*
    tags:
      - "*"

permissions:
  contents: write

jobs:
  linux-app-binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: vegardit/fast-apt-mirror.sh@v1
      - run: |
          sudo apt-get install -y sqlite3 libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
          cd frontend && deno install && deno task build && cd ..
          nix-build packaging/ledger/ledger.nix
          cp ./result/bin/ledger backend/pkg/binary/ledger
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails doctor
          wails build -tags webkit2_40
          cp build/bin/Paisa build/linux/usr/local/bin
          cp -r build/linux paisa_0.8.0_amd64
          dpkg --build paisa_0.8.0_amd64
          cd ..
          mv desktop/paisa_0.8.0_amd64.deb paisa-app-linux-amd64.deb
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
