name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          save-nix-cache: "true"
      - name: Lint and type-check
        run: nix develop "$PAISA_CI_PROFILE" --command make lint

  unit-coverage:
    name: Backend & Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: Backend and frontend coverage
        run: |
          nix develop "$PAISA_CI_PROFILE" --command bash -c "
            cd frontend && deno run -A npm:@sveltejs/kit sync
            cd ..
            make test-backend test-unit test-coverage
          "
      - name: Upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: frontend/coverage/

  integration:
    name: API Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: API regression tests
        run: |
          nix develop "$PAISA_CI_PROFILE" --command bash -c "
            cd backend && make build
            cd ../frontend && TZ=UTC deno task test:integration
          "

  browser:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - name: Browser E2E tests
        # The test server builds the frontend with the required E2E flag.
        run: nix develop "$PAISA_CI_PROFILE" --command make test-e2e
      - name: Upload browser test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
