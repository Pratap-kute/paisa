name: Windows Release

on:
  push:
    branches:
      - ci/windows-*
    tags:
      - "*"

permissions:
  contents: write

jobs:
  windows-binary:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Pre-install Bun from npm registry
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.bun\bin" | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/@oven/bun-windows-x64/-/bun-windows-x64-1.4.4.tgz" -o bun.tgz
          tar.exe -xzf bun.tgz -C "$HOME\.bun\bin" --strip-components=2 package/bin/bun.exe
          Remove-Item bun.tgz
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          choco install sqlite
          choco install nsis
          cd frontend
          bun install --frozen-lockfile
          bun run build
          cd ..
          gh release download v3.3.2 --repo FullofQuarks/Windows-Ledger-Binaries --pattern ledger.exe --clobber
          if (-not (Test-Path ledger.exe)) {
            curl.exe -fsSL --retry 5 --retry-all-errors -H "Accept: application/octet-stream" -o ledger.exe "https://api.github.com/repos/FullofQuarks/Windows-Ledger-Binaries/releases/assets/102333204"
          }
          cp ledger.exe backend/pkg/binary/ledger
          cd backend
          go build -o ../paisa-cli-windows-amd64.exe .
          cd ..
          $env:PATH += ";C:\Program Files (x86)\NSIS\Bin"
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build -nsis -webview2 embed
          cd ..
          cp .\desktop\build\bin\paisa-amd64-installer.exe paisa-app-windows-amd64.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
