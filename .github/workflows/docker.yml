name: Docker Image Release
on:
  push:
    branches:
      - ci/docker-*
    tags:
      - "*"

jobs:
  docker-base:
    name: Build & Push Base Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: pratapkute/paisa
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-variants:
    name: Build & Push Variant (${{ matrix.variant }})
    needs: docker-base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: hledger
            file: ./packaging/docker/hledger.Dockerfile
            suffix: -hledger
          - variant: beancount
            file: ./packaging/docker/beancount.Dockerfile
            suffix: -beancount
          - variant: all
            file: ./packaging/docker/all.Dockerfile
            suffix: -all
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: pratapkute/paisa
          flavor: |
            latest=auto
            prefix=
            suffix=${{ matrix.suffix }},onlatest=true
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
