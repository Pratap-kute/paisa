name: Linux App Release

on:
  push:
    branches:
      - ci/linux-app-*
    tags:
      - "*"

permissions:
  contents: write

jobs:
  linux-app-binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pre-install Bun from npm registry
        run: |
          mkdir -p ~/.bun/bin
          curl -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-1.4.4.tgz" | tar -xz -C ~/.bun/bin --strip-components=2 package/bin/bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: vegardit/fast-apt-mirror.sh@v1
      - run: |
          sudo apt-get install -y sqlite3 libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
          cd frontend && bun install --frozen-lockfile && bun run build && cd ..
          docker build -t ledger-builder packaging/ledger
          container_id=$(docker create ledger-builder)
          docker cp "$container_id":/ledger backend/pkg/binary/ledger
          docker rm "$container_id"
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails doctor
          wails build -tags webkit2_40
          cp build/bin/Paisa build/linux/usr/local/bin
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          package_dir="paisa_${version}_amd64"
          cp -r build/linux "$package_dir"
          dpkg --build "$package_dir"
          cd ..
          mv "desktop/${package_dir}.deb" paisa-app-linux-amd64.deb
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
