    type: object
  dto.TemplatesResponse:
    properties:
      templates:
        items:
          $ref: '#/definitions/dto.TemplateResponse'
        type: array
    type: object
  dto.TfIdfResponse:
    properties:
      index:
        $ref: '#/definitions/dto.IndexResponse'
      tf_idf:
        additionalProperties:
          additionalProperties:
            format: float64
            type: number
          type: object
        type: object
    type: object
  dto.TransactionResponse:
    properties:
      beginLine:
        type: integer
      date:
        type: string
      endLine:
        type: integer
      fileName:
        type: string
      id:
        type: string
      note:
        type: string
      payee:
        type: string
      postings:
        items:
          $ref: '#/definitions/dto.PostingResponse'
