name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update visual baselines on"
        required: true
        default: "ui/redesign"

concurrency:
  group: visual-update-${{ github.event.inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VITE_CONFIG_NATIVE_IGNORE_WARNING: true

jobs:
  update-baselines:
    name: Regenerate Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Build frontend and update visual baselines
        run: |
          nix develop --command bash -c "
            make build-frontend test-visual-update
          "

      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/tests/browser/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No visual baseline changes detected."
          else
            git commit -m "chore: update visual baselines from CI [skip ci]"
            git push origin ${{ github.event.inputs.branch }}
          fi
