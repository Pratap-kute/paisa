site_description: Track spending, investments, and financial plans with plain-text double-entry accounting.
site_author: Paisa contributors
site_name: Paisa
site_url: https://pratap-kute.github.io/paisa/
repo_url: https://github.com/Pratap-kute/paisa
repo_name: Pratap-kute/paisa
edit_uri: edit/master/docs/
exclude_docs: |
  development/showcase-refresh-report.md
  images/showcase/capture.md
  images/showcase/paisa-overview.gif
nav:
  - "Home": index.md
  - "Product Tour": product-tour.md
  - "Getting Started":
      - "Overview": getting-started/index.md
      - "Install Paisa": getting-started/installation.md
      - "First setup": getting-started/tutorial.md
      - "Journal examples": getting-started/journal-examples.md
  - "Using Paisa":
      - "Overview": using-paisa/index.md
      - "Everyday finances":
          - "Accounts": reference/accounts.md
          - "Financial reports": reference/financial-reports.md
          - "Financial Insights": reference/insights.md
          - "Budgets": reference/budget.md
          - "Recurring transactions": reference/recurring.md
          - "Liabilities":
              - "Overview": reference/liabilities/index.md
              - "Balances": reference/liabilities/balance.md
              - "Interest": reference/liabilities/interest.md
              - "Repayments": reference/liabilities/repayment.md
              - "Credit cards": reference/credit-cards.md
      - "Journal and imports":
          - "Journal": reference/journal.md
          - "Editor": reference/editor.md
          - "Import statements": reference/import.md
          - "Account suggestions": reference/prediction.md
          - "Bulk edit": reference/bulk-edit.md
      - "Investments":
          - "Portfolio Analysis": reference/analysis.md
          - "Commodities and prices": reference/commodities.md
          - "Allocation targets": reference/allocation-targets.md
          - "Investment performance": reference/investment-performance.md
      - "Planning":
          - "Scenario planning": reference/scenario-planning.md
          - "Goals":
              - "Overview": reference/goals/index.md
              - "Retirement": reference/goals/retirement.md
              - "Savings": reference/goals/savings.md
      - "Tools":
          - "Doctor": reference/doctor.md
          - "Sheets": reference/sheets.md
          - "Application information and logs": reference/application-information.md
  - "Reference":
      - "Overview": reference/index.md
      - "Configuration": reference/config.md
      - "Ledger CLI": reference/ledger-cli.md
      - "Authentication": reference/user-authentication.md
      - "Tax":
          - "Overview": reference/tax/index.md
          - "Tax harvesting": reference/tax/tax-harvesting.md
          - "Capital gains": reference/tax/capital-gains.md
          - "Schedule AL": reference/tax/schedule-al.md
      - "Changelog": reference/changelog.md
  - "FAQ": faq.md
  - "Project":
      - "History and community": project/index.md
      - "Manifesto": manifesto.md
      - "Blog": blog/index.md
  - "Development":
      - "Overview": development/index.md
      - "API": development/api.md
      - "Testing": development/testing.md
      - "Design":
          - "Chart architecture": design/frontend-chart-architecture.md
          - "UI specification": design/paisa-ui-spec.md
theme:
  custom_dir: overrides
  name: material
  font: false
  favicon: images/favicon.png
  icon:
    logo: paisa/logo
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: white
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: black
      accent: indigo
      toggle:
        icon: material/moon-waning-crescent
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.keys
  - footnotes
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      linenums: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

copyright: |
  Paisa was originally created by <a href="https://github.com/ananthakumaran">Anantha Kumaran</a>.
  Maintained by <a href="https://github.com/Pratap-kute/paisa/graphs/contributors">contributors</a>
  and licensed under <a href="https://github.com/Pratap-kute/paisa/blob/master/COPYING">AGPL-3.0-or-later</a>.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pratap-kute/paisa
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/pratapkute/paisa
  status:
    new: Recently added
plugins:
  - search
  - blog
hooks:
  - docs/lexer/hook.py
