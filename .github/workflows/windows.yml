name: Windows Release

on:
  push:
    branches:
      - ci/windows-*
    tags:
      - "*"

jobs:
  windows-binary:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2.4.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: |
          choco install sqlite
          choco install wget
          choco install nsis
          cd frontend
          deno install
          deno task build
          cd ..
          wget https://github.com/FullofQuarks/Windows-Ledger-Binaries/releases/download/v3.3.2/ledger.exe
          cp ledger.exe backend/pkg/binary/ledger
          cd backend
          go build -o ../paisa-cli-windows-amd64.exe .
          cd ..
          $env:PATH += ";C:\Program Files (x86)\NSIS\Bin"
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build -tags webkit2_40 -nsis -webview2 embed
          cd ..
          cp .\desktop\build\bin\paisa-amd64-installer.exe paisa-app-windows-amd64.exe
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            paisa-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
