name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        run: nix develop --command bash -c "cd frontend && deno install"
      - name: Lint and type-check
        run: nix develop --command make lint

  unit-coverage:
    name: Backend & Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        run: nix develop --command bash -c "cd frontend && deno install"
      - name: Backend tests
        run: nix develop --command make test-backend
      - name: Frontend unit tests
        run: nix develop --command make test-unit
      - name: Core coverage gate and component coverage report
        run: nix develop --command make test-coverage
      - name: Upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: coverage/

  e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        run: nix develop --command bash -c "cd frontend && deno install"
      - name: Build frontend static assets
        run: nix develop --command make build-frontend
      - name: Browser E2E tests
        run: nix develop --command make test-e2e
      - name: Upload E2E test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  visual:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        run: nix develop --command bash -c "cd frontend && deno install"
      - name: Build frontend static assets
        run: nix develop --command make build-frontend
      - name: Visual snapshot tests
        run: nix develop --command make test-visual
      - name: Upload visual test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-reports-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
